<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            /* lagura */
            width: 400px;
            /* Altura */
            height: 400px;
            /* Para unir as linhas entre as celulas */
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            /* Alinhamento horizontal 
                - center - centro
                - left - esquerda
                - right - direita
            */
            text-align: center;
            /* Alinhamento vertical
                - top - em cima
                - bottom - em baixo
                - middle - no centro
            */
            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }

        .numer {
            text-align: left;
        }

        .nume {
            text-align: center;
        }

        .num {
            text-align: top;
        }

        .nu {
            text-align: middle;
        }

        .n {
            text-align: bottom;
        }

        .linha {
            height: 50px;
        }

        .linh {
            height: 150px;
        }

        


    </style>
</head>
<body>
    <h1>Gabarito - Trabalhando com alinhamento</h1>
    <!-- É utilzado para criar organização de dados -->
    <!-- 
        Hierarquia de tabelas (Simples)
        Table = tabela
            Table Row = Linha da tabela
                Table Header = cabeçalho de tabela Data = dado da tabela Data = dado da tabela
    -->
    <table>
        <tr class="linha"> <!-- Primeira linha -->
            <td class="numer">A1 (esquerda)</td>
            <td class="nume">B1 (padrão centro)</td>
            <td class="numero">C1 (direita)</td>
        </tr> <!-- Segunda linha -->
        <tr class="linh">
            <td class="num">A2 (topo)</td>
            <td class="nu">B2 (padrão)</td>
            <td class="n">C2 (baixo)</td>
        </tr>
        <tr class="linh"> <!-- Terceira linha -->
            <td class="num">A3 (topo)</td>
            <td class="n">B3 (baixo)</td>
            <td class="nu">C3 (padrão)</td>
        </tr>
        <tr class="linha"> <!-- Quarta linha -->
            <td>A4</td>
            <td class="numero">1000 (número á direita)</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
